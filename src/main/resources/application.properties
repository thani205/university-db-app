spring.application.name=university-db-app
# ---- MySQL connection (XAMPP defaults: user root, empty password) ----
# The database "university_db" is created by YOU with sql/schema.sql (not by Spring Boot)
spring.datasource.url=jdbc:mysql://localhost:3306/university_db?useSSL=false&allowPublicKe
yRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
# ---- JPA / Hibernate ----
# validate: validate the schema, makes no changes to the database.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
server.port=8081
